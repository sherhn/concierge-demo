<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>консьерж. — демо приложения гостя</title>
<style>
  @font-face{font-family:"Golos";src:url("assets/golos-400.ttf") format("truetype");font-weight:400;font-display:swap}
  @font-face{font-family:"Golos";src:url("assets/golos-900.ttf") format("truetype");font-weight:900;font-display:swap}
  :root{
    --ink:#080808; --gray:#777; --line:#e9e9e9; --bg:#f8f8f8;
    --blue:blue; --red:#d0342c; --green:#0e9f6e;
    --sans:"Golos",Arial,sans-serif;
    --mono:ui-monospace,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);font-weight:400;background:#fff;color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh}
  button{font-family:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px 50px}
  header{display:flex;align-items:center;justify-content:space-between;height:84px}
  .logo{font-size:24px;font-weight:400;letter-spacing:-.02em}
  .logo b::after{content:".";color:var(--blue)}
  .logo b{font-weight:400}
  .logo small{color:var(--gray);font-size:13px;margin-left:14px}
  .back{font-size:14px;color:var(--blue);text-decoration:none}
  .back:hover{text-decoration:underline}
  hr.rule{border:none;border-top:1px solid var(--line)}

  /* превью: две колонки */
  .cols{display:grid;grid-template-columns:420px 1fr;gap:44px;align-items:start;margin-top:26px}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}

  /* телефон */
  .phone{background:#0d0d10;border-radius:34px;padding:16px;width:100%;max-width:410px;margin:0 auto;box-shadow:0 30px 70px -26px rgba(8,8,16,.5)}
  .pname{color:#8b8f98;font-size:11px;letter-spacing:.1em;text-align:center;margin:4px 0 12px}
  .chat{background:#15161a;border-radius:22px;padding:16px 14px;min-height:430px;display:flex;flex-direction:column;justify-content:flex-end}
  .msg{max-width:86%;padding:11px 15px;border-radius:16px;font-size:14.5px;margin-bottom:10px;line-height:1.45;opacity:1;transition:opacity .3s}
  .msg.g{background:#23242b;color:#e9e9ee;border-bottom-left-radius:5px;align-self:flex-start}
  .msg.a{background:#2547ff;color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
  .msg .st{display:block;font-size:10px;opacity:.55;margin-top:5px;text-align:right}
  .qrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .qbtn{background:#23242b;border:1px solid #34363f;color:#c9ccd6;border-radius:18px;padding:8px 14px;font-size:13px;cursor:pointer;transition:.15s}
  .qbtn:hover{border-color:#2547ff;color:#fff}

  /* правая колонка: события гостя + статус заказа */
  .sidecard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  .ev{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .ev:last-child{border:none}
  .ev .t{font-family:var(--mono);font-size:11.5px;color:#999;flex-shrink:0;padding-top:2px}
  .ev .dot{flex-shrink:0;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:6px}
  .ev .dot.gr{background:var(--green)}
  .okline{font-size:13px;color:var(--green);margin-top:8px}
  .stline{font-size:13px;color:#777;margin-top:8px}

  /* рейтинг */
  .rstars{display:flex;gap:8px}
  .rstar{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:17px;cursor:pointer;color:var(--ink);transition:.15s}
  .rstar:hover{border-color:var(--blue);color:var(--blue)}

  /* мои заказы */
  .orders{display:flex;flex-direction:column;gap:10px}
  .ocard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px}
  .ocard .on{font-weight:400}
  .ocard .om{color:#999;font-size:12.5px;margin-top:3px}
  .ocard .os{display:inline-block;font-size:11.5px;border-radius:20px;padding:3px 11px;margin-top:7px}
  .os.done{background:#e5f5ef;color:#0e9f6e}
  .os.work{background:#e8eefb;color:#2563eb}
  .os.new{background:#f2f2f2;color:#777}

  :root{--blue:#2547ff;--gray:#626673}
  header{gap:12px;height:auto;min-height:78px}
  .logo a{color:inherit;text-decoration:none}
  .cols>section{min-width:0}
  .chat{height:340px;min-height:0;overflow:auto;justify-content:flex-start}
  .msg{flex-shrink:0;overflow-wrap:anywhere}
  .msg .st{opacity:.82}
  .message-form{display:flex;gap:8px;margin-top:12px}
  .message-form input{min-width:0;flex:1;background:#23242b;color:white;border:1px solid #454854;border-radius:12px;padding:10px;font:inherit}
  .message-form button,.secondary{border:1px solid var(--blue);background:var(--blue);color:white;border-radius:10px;padding:8px 12px;cursor:pointer}
  button:disabled{opacity:.45;cursor:default}
  .sidecard h2{font-size:17px;margin-bottom:14px}
  .demo-note{color:var(--gray);font-size:13px;text-align:center;margin:12px auto 0;max-width:410px}
  .ocard small{color:var(--gray);white-space:nowrap}
  .ocard p{overflow-wrap:anywhere}
  .rstars{margin-top:8px}
  .rstar{width:38px;height:38px}
  .journey{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin-bottom:10px}
  .journey li{padding:4px 8px;border-radius:6px;background:#f1f3f7;color:#51576b;font-size:12px}
  .journey .current{background:#e8edff;color:#1933c5;font-weight:bold}
  .secondary{margin-top:14px;background:#fff;color:var(--blue)}
  @media(max-width:560px){.wrap{padding:0 14px 30px}.logo small{display:block;margin-left:0}.phone{padding:11px}.cols{gap:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><a href="index.html"><b>консьерж</b></a><small>Режим гостя</small></div>
    <a class="back" href="dashboard.html">К панели персонала →</a>
  </header>
  <hr class="rule">
  <div class="cols">
    <section aria-label="Чат отеля">
      <div class="phone">
        <div class="pname">ОТЕЛЬ «АСТОРИЯ» · МАРИЯ · НОМЕР 204</div>
        <div class="chat" id="chat" role="log" aria-label="Переписка"></div>
        <form class="message-form" id="message-form">
          <input id="guest-message" aria-label="Сообщение гостя" placeholder="Напишите консьержу" maxlength="500" required>
          <button type="submit">Отправить</button>
        </form>
        <div class="qrow" id="scenarios">
          <button class="qbtn" data-message="Когда завтрак?">Когда завтрак?</button>
          <button class="qbtn" data-message="Принесите два комплекта полотенец">Полотенца</button>
          <button class="qbtn" data-message="Можно уборку после 15:00?">Уборка</button>
          <button class="qbtn" data-message="Столик на двоих на 19:00">Столик</button>
          <button class="qbtn" data-message="Соседи шумят, не могу уснуть">Жалоба на шум</button>
          <button class="qbtn" data-message="Есть ли зарядка для электромобиля?">Зарядка для авто</button>
        </div>
      </div>
      <p class="demo-note">В демо ответы подбираются по правилам из базы отеля. Заявки обрабатываются в панели персонала.</p>
    </section>

    <section aria-label="Проживание">
      <div class="sidecard">
        <h2>Мои заявки</h2>
        <div class="orders" id="orders"></div>
      </div>
      <div class="sidecard">
        <h2>Путь гостя · <span id="guest-stage"></span></h2>
        <ol id="journey" class="journey"></ol>
        <div id="events"></div>
        <button id="checkout" class="secondary" type="button">Смоделировать выезд</button>
      </div>
    </section>
  </div>
</div>
<script src="demo.js"></script>
<script src="guest.js"></script>
</body>
</html>
